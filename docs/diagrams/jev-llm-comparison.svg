<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="jev-llm-comparison-title jev-llm-comparison-desc">
<title id="jev-llm-comparison-title">생성형 AI와 Jev, 무엇이 다를까?</title>
<desc id="jev-llm-comparison-desc">결과 형태, 처리 방식, 광고 활용, 속도와 비용을 비교합니다. 생성형 AI는 문장 생성과 설명에, Jev는 정해진 형식의 반복 판단에 초점을 둡니다. LLM도 구조화된 출력이 가능하며 실제 속도·비용·정확도는 업무별 검증이 필요합니다.</desc>
<defs><style>body{margin:0;background:#f5f2ea}svg{display:block;width:960px;max-width:100%;height:auto;margin:auto}text{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#252b26;font-size:24px}.label{font-size:20px;fill:#62665e}.head{font-weight:600}.title{font-size:32px;font-weight:600}</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#62665e"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526047"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526047"/></marker>
</defs>
<rect width="960" height="640" fill="#f5f2ea"/>
<text x="40" y="40" class="label">INSIGHT BREWER / AI &amp; ADVERTISING</text>
<text x="40" y="84" class="title">생성형 AI와 Jev, 무엇이 다를까?</text>
<text x="40" y="120" class="label">우열보다, 맡길 업무의 차이</text>
<rect x="40" y="144" width="880" height="56" rx="4" fill="#ebe7dc"/>
<rect x="572" y="144" width="348" height="56" rx="4" fill="#526047"/>
<text x="56" y="180" class="head">비교 항목</text>
<text x="240" y="180" class="head">생성형 AI (LLM)</text>
<text x="592" y="180" style="fill:#fffdf7;font-weight:600">Jev</text>
<g fill="none" stroke="#cccfc2"><path d="M224 200 V520"/><path d="M572 200 V520"/><path d="M40 280 H920"/><path d="M40 360 H920"/><path d="M40 440 H920"/><path d="M40 520 H920"/></g>
<text x="56" y="248" class="label">01  결과 형태</text>
<text x="240" y="248">설명·요약·문장 생성</text>
<text x="592" y="248">선택·점수·확률</text>
<text x="56" y="328" class="label">02  처리 방식</text>
<text x="240" y="316">일반적으로 토큰을</text><text x="240" y="348">순차 생성</text>
<text x="592" y="316">같은 입력의 여러 질문을</text><text x="592" y="348">병렬 평가</text>
<text x="56" y="408" class="label">03  광고 활용</text>
<text x="240" y="396">캠페인 전략 초안</text><text x="240" y="428">광고 문구 작성</text>
<text x="592" y="396">검색어·소재 분류</text><text x="592" y="428">검수 대상 선별</text>
<text x="56" y="488" class="label">04  속도·비용</text>
<text x="240" y="476">모델·입출력 길이·추론량에</text><text x="240" y="508">따라 달라짐</text>
<text x="592" y="476">반복 판단의 시간·비용</text><text x="592" y="508">절감에 초점</text>
<text x="40" y="556" class="label">LLM도 구조화된 출력 가능</text>
<text x="40" y="588" class="label">실제 속도·비용·정확도는 업무별 검증 필요</text>
<text x="40" y="620" class="label">출처: TypeSafe AI · Vercel 공식 발표</text>
