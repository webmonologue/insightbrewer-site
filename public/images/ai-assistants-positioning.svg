<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="position-title position-desc"><title id="position-title">AI 비서의 포지셔닝</title><desc id="position-desc">공식 설명의 주요 활용 방향과 운영 방식을 정성적으로 배치한 지도입니다. 위치는 성능 또는 보안 점수가 아닙니다.</desc><defs><marker id="position-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#62665e"/></marker><marker id="position-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#526047"/></marker><marker id="position-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#62665e"/></marker></defs><rect width="100%" height="100%" fill="#f5f2ea"/><g font-family="Apple SD Gothic Neo,sans-serif"><text x="40" y="52" font-size="28" font-weight="600" text-anchor="start" fill="#252b26">활용 방향과 운영 방식으로 보는 AI 비서</text><text x="40" y="84" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">제품의 강조점을 정성적으로 배치했습니다. 위·오른쪽이 더 우수하다는 뜻은 아닙니다.</text><path d="M 128 360 H 832 M 480 144 V 576" fill="none" stroke="#cccfc2" stroke-width="2"/><text x="480" y="128" font-size="20" font-weight="600" text-anchor="middle" fill="#252b26">업무 실행</text><text x="480" y="608" font-size="20" font-weight="600" text-anchor="middle" fill="#252b26">생활 조율</text><text x="120" y="340" font-size="20" font-weight="600" text-anchor="start" fill="#252b26">서비스 이용</text><text x="832" y="340" font-size="20" font-weight="600" text-anchor="end" fill="#252b26">직접 운영</text><circle cx="176" cy="212" r="4" fill="#526047"/><text x="188" y="220" font-size="20" font-weight="600" text-anchor="start" fill="#252b26">Dots</text><circle cx="328" cy="172" r="4" fill="#526047"/><text x="340" y="180" font-size="20" font-weight="600" text-anchor="start" fill="#252b26">Claude Duet</text><circle cx="332" cy="268" r="4" fill="#526047"/><text x="344" y="276" font-size="20" font-weight="600" text-anchor="start" fill="#252b26">Grok Bot</text><circle cx="132" cy="408" r="4" fill="#526047"/><text x="144" y="416" font-size="20" font-weight="600" text-anchor="start" fill="#252b26">Gemini Task</text><circle cx="180" cy="492" r="4" fill="#526047"/><text x="192" y="500" font-size="20" font-weight="600" text-anchor="start" fill="#252b26">Meta Muse</text><circle cx="336" cy="540" r="4" fill="#526047"/><text x="348" y="548" font-size="20" font-weight="600" text-anchor="start" fill="#252b26">피클</text><circle cx="672" cy="212" r="4" fill="#526047"/><text x="684" y="220" font-size="20" font-weight="600" text-anchor="start" fill="#252b26">Hermes Agent</text><circle cx="688" cy="288" r="4" fill="#526047"/><text x="700" y="296" font-size="20" font-weight="600" text-anchor="start" fill="#252b26">OpenClaw</text><text x="576" y="468" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">직접 운영형도 생활 업무에 활용할 수 있습니다.</text><text x="576" y="496" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">배치는 배타적인 기능 구분이 아닙니다.</text><line x1="40" y1="632" x2="920" y2="632" stroke="#cccfc2"/><text x="40" y="660" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">정성적 해석 · 수치 평가 아님 | 근거: 각 제품의 공식 안내</text></g></svg>
