<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 816" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">AI 비서가 작업을 실행하는 흐름</title><desc id="flow-desc">요청부터 정보 확인, 작업 선택, 권한 검토, 도구 실행, 결과 확인과 보고로 이어집니다. 승인 거부는 중단하고 추가 작업은 다시 선택 단계로 돌아갑니다.</desc><defs><marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#62665e"/></marker><marker id="flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#526047"/></marker><marker id="flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#62665e"/></marker></defs><rect width="100%" height="100%" fill="#f5f2ea"/><g font-family="Apple SD Gothic Neo,sans-serif"><text x="40" y="52" font-size="28" font-weight="600" text-anchor="start" fill="#252b26">AI 비서는 어떻게 일을 이어갈까</text><text x="40" y="84" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">일반적인 개념도입니다. 제품별 구현과 승인 정책은 다릅니다.</text><path d="M 480 168 V 192" fill="none" stroke="#62665e" stroke-width="2" marker-end="url(#flow-arrow)"/><path d="M 480 248 V 272" fill="none" stroke="#62665e" stroke-width="2" marker-end="url(#flow-arrow)"/><path d="M 480 328 V 360" fill="none" stroke="#62665e" stroke-width="2" marker-end="url(#flow-arrow)"/><path d="M 480 456 V 496" fill="none" stroke="#62665e" stroke-width="2" marker-end="url(#flow-arrow)"/><path d="M 480 552 V 584" fill="none" stroke="#62665e" stroke-width="2" marker-end="url(#flow-arrow)"/><path d="M 480 640 V 688" fill="none" stroke="#62665e" stroke-width="2" marker-end="url(#flow-arrow)"/><path d="M 336 408 H 240" fill="none" stroke="#62665e" stroke-width="2" marker-end="url(#flow-arrow)"/><path d="M 640 612 H 840 Q 848 612 848 604 V 308 Q 848 300 840 300 H 640" fill="none" stroke="#62665e" stroke-width="2" marker-end="url(#flow-arrow)" stroke-dasharray="8 4"/><rect x="248" y="376" width="80" height="24" fill="#f5f2ea"/><text x="288" y="396" font-size="16" font-weight="400" text-anchor="middle" fill="#62665e">거부·불가</text><text x="500" y="484" font-size="16" font-weight="400" text-anchor="start" fill="#526047">허용</text><text x="500" y="672" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">완료</text><text x="860" y="444" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">추가</text><text x="860" y="468" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">작업</text><rect x="320" y="112" width="320" height="56" rx="28" fill="#f5f2ea" stroke="#62665e"/><text x="344" y="148" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">01</text><text x="496" y="148" font-size="20" font-weight="600" text-anchor="middle" fill="#252b26">요청 또는 예약된 실행</text><rect x="320" y="192" width="320" height="56" rx="8" fill="#f5f2ea" stroke="#62665e"/><text x="344" y="228" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">02</text><text x="496" y="228" font-size="20" font-weight="600" text-anchor="middle" fill="#252b26">관련 기억·정보 확인</text><rect x="320" y="272" width="320" height="56" rx="8" fill="#f5f2ea" stroke="#62665e"/><text x="344" y="308" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">03</text><text x="496" y="308" font-size="20" font-weight="600" text-anchor="middle" fill="#252b26">다음 작업 선택</text><path d="M 480 360 L 624 408 L 480 456 L 336 408 Z" fill="#ebe7dc" stroke="#526047" stroke-width="2"/><text x="480" y="404" font-size="20" font-weight="600" text-anchor="middle" fill="#252b26">04  권한 검토</text><text x="480" y="428" font-size="16" font-weight="400" text-anchor="middle" fill="#526047">필요시 사용자 승인</text><rect x="48" y="376" width="192" height="64" rx="8" fill="#f5f2ea" stroke="#62665e"/><text x="144" y="404" font-size="20" font-weight="600" text-anchor="middle" fill="#252b26">중단·사용자 확인</text><text x="144" y="428" font-size="12" font-weight="400" text-anchor="middle" fill="#62665e">승인 없이 실행하지 않음</text><rect x="320" y="496" width="320" height="56" rx="8" fill="#f5f2ea" stroke="#62665e"/><text x="344" y="532" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">05</text><text x="496" y="532" font-size="20" font-weight="600" text-anchor="middle" fill="#252b26">도구 실행</text><rect x="320" y="584" width="320" height="56" rx="8" fill="#f5f2ea" stroke="#62665e"/><text x="344" y="620" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">06</text><text x="496" y="620" font-size="20" font-weight="600" text-anchor="middle" fill="#252b26">실제 결과 확인</text><rect x="320" y="688" width="320" height="56" rx="28" fill="#f5f2ea" stroke="#62665e"/><text x="344" y="724" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">07</text><text x="496" y="724" font-size="20" font-weight="600" text-anchor="middle" fill="#252b26">결과 보고</text><text x="656" y="528" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">API · 브라우저 · 파일 등</text><line x1="40" y1="768" x2="920" y2="768" stroke="#cccfc2"/><text x="40" y="796" font-size="16" font-weight="400" text-anchor="start" fill="#62665e">실선: 처리 흐름     점선: 후속 작업 반복     권한 검토는 각 실행 전에 적용</text></g></svg>
