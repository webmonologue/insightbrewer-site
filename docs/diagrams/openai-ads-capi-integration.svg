<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="openai-ads-capi-integration-title openai-ads-capi-integration-desc">
<title id="openai-ads-capi-integration-title">OpenAI Ads 전환 연동 구조</title>
<desc id="openai-ads-capi-integration-desc">광고주 시스템의 확정 이벤트를 변환하고 oppref를 연결해 Conversions API로 OpenAI 데이터 소스에 전송합니다. 별도로 Ads Manager 또는 Ads API에서 데이터 소스와 이벤트를 전환으로 정의하고 캠페인에 연결합니다.</desc>
<defs><style>body{margin:0;background:#f5f2ea}svg{display:block;width:960px;max-width:100%;height:auto;margin:auto}text{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#252b26}.heading{font-size:32px;font-weight:600}.label{font-size:24px;font-weight:600}.sub{font-size:20px;fill:#62665e}.section{font-size:24px;font-weight:600;fill:#526047}</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#62665e"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526047"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526047"/></marker>
</defs>
<rect width="960" height="600" fill="#f5f2ea"/>
<text x="40" y="60" class="heading">OpenAI Ads 전환 연동</text>
<text x="40" y="96" class="sub">이벤트를 보내는 경로와 광고를 설정하는 경로는 다릅니다</text>
<text x="40" y="152" class="section">A. 이벤트 전송 · 광고주 서버 → OpenAI</text>
<!-- Aligned ports need no bends. No crossing, overlapping paths or arrow labels. -->
<g fill="none" stroke="#62665e" stroke-width="2" marker-end="url(#arrow)">
<path d="M224 240 H264"/><path d="M480 240 H520"/>
</g>
<path d="M704 240 H744" fill="none" stroke="#526047" stroke-width="2" marker-end="url(#arrow-link)"/>
<path d="M480 452 H584" fill="none" stroke="#62665e" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
<rect x="40" y="180" width="184" height="120" rx="8" fill="#ebe7dc" stroke="#cccfc2"/>
<text x="56" y="216" class="label">광고주 시스템</text>
<text x="56" y="252" class="sub">주문 · 회원 · CRM</text>
<text x="56" y="280" class="sub">구매·가입 확정</text>
<rect x="264" y="180" width="216" height="120" rx="8" fill="#fffdf7" stroke="#cccfc2"/>
<text x="280" y="216" class="label">이벤트 변환</text>
<text x="280" y="252" class="sub">OpenAI 규격 적용</text>
<text x="280" y="280" class="sub">+ oppref 연결</text>
<rect x="520" y="180" width="184" height="120" rx="8" fill="#ebe7dc" stroke="#526047" stroke-width="2"/>
<text x="536" y="216" class="label">Conversions</text>
<text x="536" y="244" class="label">API</text>
<text x="536" y="280" class="sub">서버에서 전송</text>
<rect x="744" y="180" width="176" height="120" rx="8" fill="#fffdf7" stroke="#cccfc2"/>
<text x="760" y="216" class="label">OpenAI</text>
<text x="760" y="244" class="label">데이터 소스</text>
<text x="760" y="280" class="sub">이벤트 수신</text>
<text x="40" y="332" class="sub">전송 대상은 Pixel ID로 지정 · 전송용 API 키는 서버에만 보관</text>
<line x1="40" y1="356" x2="920" y2="356" stroke="#cccfc2"/>
<text x="40" y="396" class="section">B. 별도 설정 · Ads Manager / Ads API</text>
<rect x="40" y="420" width="440" height="80" rx="8" fill="#fffdf7" stroke="#cccfc2"/>
<text x="56" y="452" class="label">전환 정의</text>
<text x="56" y="484" class="sub">위 데이터 소스 + 측정할 이벤트 선택</text>
<rect x="584" y="420" width="336" height="80" rx="8" fill="#fffdf7" stroke="#cccfc2"/>
<text x="600" y="452" class="label">캠페인 연결</text>
<text x="600" y="484" class="sub">사용할 전환 설정 지정</text>
<line x1="40" y1="532" x2="920" y2="532" stroke="#cccfc2"/>
<line x1="40" y1="564" x2="80" y2="564" stroke="#62665e" stroke-width="2"/>
<text x="92" y="572" class="sub">이벤트 전송</text>
<line x1="264" y1="564" x2="304" y2="564" stroke="#62665e" stroke-width="2" stroke-dasharray="8 4"/>
<text x="316" y="572" class="sub">설정 연결</text>
<text x="536" y="572" class="sub">이벤트 수신 ≠ 광고 기여도 인정</text>
</svg>
